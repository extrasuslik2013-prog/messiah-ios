name: Messiah
options:
  bundleIdPrefix: com.imronaripov
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.1"
    CURRENT_PROJECT_VERSION: "4"
targets:
  Messiah:
    type: application
    platform: iOS
    sources:
      - path: Messiah
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.imronaripov.messiah
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Messiah/Info.plist
      properties:
        CFBundleDisplayName: Messiah
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Messiah connects to your Ollama server and to Messiah Updater on your PC over the local network.
        NSBonjourServices:
          - _messiah-upd._tcp
        NSMicrophoneUsageDescription: Messiah listens to your voice for dictation and live chat.
        NSSpeechRecognitionUsageDescription: Messiah turns your speech into text using Apple speech recognition.
